# ==============================================================================
# Google Cloud Build & Cloud Run Pipeline for FormaGuard Backend
# ==============================================================================
# Builds the Docker container from repo root (including fortyguard SDK & agent_backend)
# and deploys to Google Cloud Run in us-central1.
# ==============================================================================

substitutions:
  _TAG: 'latest'

steps:
  # 1. Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'agent_backend/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/formaguard-backend:${_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/formaguard-backend:latest'
      - '.'

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/formaguard-backend:${_TAG}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/formaguard-backend:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'formaguard-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/formaguard-backend:${_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'HOST=0.0.0.0'

images:
  - 'gcr.io/$PROJECT_ID/formaguard-backend:${_TAG}'
  - 'gcr.io/$PROJECT_ID/formaguard-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
